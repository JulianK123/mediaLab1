<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 1. HLS Player</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video-js.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/video.js/8.6.1/video.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>My first HLS player</h1>
  <div class="player-wrap">
    <video id="hlsVideo" class="video-js" playsinline></video>
  </div>
  <div class="controls">
    <button id="btnPlay">Play</button>
    <button id="btnPause">Pause</button>
    <button id="btnStop">Stop</button>
    <button id="btnBack">-5s</button>
    <button id="btnForward">+5s</button>
  </div>
  <script src="js/control.js"></script>
</body>
</html>
